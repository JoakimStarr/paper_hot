name: Build & Push Docker Images

# 触发：推送到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          # 阿里云个人版容器镜像服务地址（与 docker-compose.yml 中的 image 前缀一致）
          registry: crpi-3fswqinlrhpn1djk.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 后端镜像 ----------
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            crpi-3fswqinlrhpn1djk.cn-beijing.personal.cr.aliyuncs.com/docker-miskies/paper_hot:backend-latest
            crpi-3fswqinlrhpn1djk.cn-beijing.personal.cr.aliyuncs.com/docker-miskies/paper_hot:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 前端镜像 ----------
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            BACKEND_API_URL=http://backend:8000
          tags: |
            crpi-3fswqinlrhpn1djk.cn-beijing.personal.cr.aliyuncs.com/docker-miskies/paper_hot:frontend-latest
            crpi-3fswqinlrhpn1djk.cn-beijing.personal.cr.aliyuncs.com/docker-miskies/paper_hot:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
